services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex-domaindrivendesign-lab
    ports:
      - "3017:3017"
    environment:
      - PORT=3017
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3017 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
